name: Build and Push Docker Image

# v2 时代的镜像构建任务（由 v1 的 docker-build.yml 改造而来，原任务服务 hkmcy 的 :latest）
#
# 构建源码：上游 openchamber/openchamber（无需先同步 fork；fork 同步只作为触发时机）
# 推送标签：
#   :v2         - 滚动最新 v2（sad VPS 使用）
#   :v2-preview - 过渡期兼容（sad 当前 run 命令引用的是它；重建后可改用 :v2）
#   :latest     - 暂不接管！hkmcy 的 v1 仍在使用该标签；
#                 等 v1 正式弃用后，在 tags 里加一行 ghcr.io/<owner>/openchamber:latest 即可
on:
  workflow_dispatch: # 手动触发：Actions -> Build and Push Docker Image -> Run workflow
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 直接取上游 v2 源码。
      #   跟滚动最新 -> ref: main
      #   固定版本   -> ref: v2.0.0（发布 tag）
      - name: Checkout upstream v2 source
        uses: actions/checkout@v4
        with:
          repository: openchamber/openchamber
          ref: main
          fetch-depth: 1

      # 自动将用户名转为小写 (QAQstar -> qaqstar)
      - name: Convert repository owner to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/openchamber:latest
            ghcr.io/${{ env.OWNER_LOWER }}/openchamber:v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
